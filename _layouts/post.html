<!DOCTYPE html>
<html data-theme="light" lang="en" itemscope itemtype="http://schema.org/BlogPosting" {% if page.main-class %}class="post-{{ page.main-class }}"{% endif %}>
    {% include head.html %}
    <body>
        {% include svg-icons.html %}
        {% include header-post.html %}

        <section class="post">
            <article role="article" id="post" class="post-content" itemprop="articleBody">
                {% if page.geojson %}
                <div id="root" data-geojson="{{ page.geojson }}"></div>
                {% endif %}
                {{ content }}
            </article>

            {% include share.html %}
            {% include author.html %}
            {% include footer.html %}
        </section>
    </body>
</html>
